<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My personal website</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
            ☰
        </button>
        <div class="nav-links" id="nav-links">
            <a class="active" href="../index.html#home">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#current">Current Project</a>
            <a href="./index.html" aria-current="page">All Projects</a>
            <a href="../index.html#skills">Skills and Certifications</a>
            <a href="../index.html#interests">Interests</a>
            <a href="../index.html#links">Links and Contact</a>
        </div>
    </nav>
    <br>
    <br>
    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const navLinks = document.querySelector(".nav-links");

        menuToggle.addEventListener("click", () => {
            const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";
            menuToggle.setAttribute("aria-expanded", String(!isExpanded));
            menuToggle.setAttribute(
                "aria-label",
                isExpanded ? "Open navigation menu" : "Close navigation menu"
            );
            navLinks.classList.toggle("is-open", !isExpanded);
        });

        navLinks.addEventListener("click", (event) => {
            if (event.target.closest("a")) {
                menuToggle.setAttribute("aria-expanded", "false");
                menuToggle.setAttribute("aria-label", "Open navigation menu");
                navLinks.classList.remove("is-open");
            }
        });
    </script>
    <br>
    <footer>
        © 2026 LPcomix Productions, made with ❤️ by Louis
    </footer>
    <br>
</body>
</html>
